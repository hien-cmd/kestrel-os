<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kestrel OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   KESTREL OS  ·  design tokens
   Light appliance chrome over a petrol desk. Amber signal lamps.
   ============================================================ */
:root{
  --desk-1:#0e414c;
  --desk-2:#04161c;
  --shell:#d6d3cb;
  --shell-hi:#e9e6de;
  --shell-lo:#b9b6ad;
  --edge:#a5a29a;
  --paper:#f8f7f3;
  --paper-2:#eeece6;
  --ink:#1b1d1e;
  --dim:#6c7072;
  --amber:#f0a92c;
  --go:#4f9d69;
  --stop:#cf5a4c;
  --field:#12171a;
  --field-ink:#dfe6e3;

  --r-win:10px;
  --r-ctl:6px;
  --r-chip:4px;

  --shadow-win:0 1px 0 rgba(255,255,255,.5) inset, 0 18px 40px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.3);
  --bar:48px;
  --ui:"Space Grotesk", "Helvetica Neue", Inter, system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --t:160ms cubic-bezier(.2,.7,.3,1);
}
html[data-theme="dark"]{
  --shell:#2a2e31;
  --shell-hi:#383d41;
  --shell-lo:#202325;
  --edge:#15181a;
  --paper:#1a1d1f;
  --paper-2:#212527;
  --ink:#e4e2dc;
  --dim:#9aa0a2;
  --desk-1:#131a1d;
  --desk-2:#05090b;
  --shadow-win:0 1px 0 rgba(255,255,255,.06) inset, 0 18px 40px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.5);
}
html[data-motion="off"] *{animation:none !important; transition:none !important;}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%; overflow:hidden;}
body{
  font-family:var(--ui);
  font-size:13px;
  line-height:1.5;
  color:var(--ink);
  background:var(--desk-2);
  -webkit-font-smoothing:antialiased;
  user-select:none;
  touch-action:manipulation;
}
button,input,textarea,select{font:inherit; color:inherit;}
button{cursor:pointer; background:none; border:none;}
:focus-visible{outline:2px solid var(--amber); outline-offset:1px;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--edge); border-radius:6px; border:3px solid transparent; background-clip:content-box;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-corner{background:transparent;}

/* ---------- physical control surface ---------- */
.ctl{
  background:linear-gradient(180deg,var(--shell-hi),var(--shell));
  border:1px solid var(--edge);
  border-radius:var(--r-ctl);
  box-shadow:0 1px 0 rgba(255,255,255,.55) inset, 0 1px 1px rgba(0,0,0,.12);
  padding:5px 11px;
  color:var(--ink);
  transition:transform var(--t), background var(--t);
}
.ctl:hover{background:linear-gradient(180deg,#fff,var(--shell-hi));}
html[data-theme="dark"] .ctl:hover{background:linear-gradient(180deg,#43494d,var(--shell-hi));}
.ctl:active{transform:translateY(1px); box-shadow:0 1px 2px rgba(0,0,0,.2) inset;}
.ctl[aria-pressed="true"], .ctl.on{
  background:linear-gradient(180deg,var(--shell-lo),var(--shell));
  box-shadow:0 2px 4px rgba(0,0,0,.22) inset;
  border-color:var(--amber);
}

/* ============================================================
   BOOT
   ============================================================ */
#boot{
  position:fixed; inset:0; z-index:9000;
  background:#07090a;
  color:#cfd6d4;
  font-family:var(--mono);
  font-size:13px;
  padding:clamp(20px,6vh,70px) clamp(18px,7vw,90px);
  display:flex; flex-direction:column; gap:2px;
  overflow:hidden;
}
#boot .mark{
  font-family:var(--ui); font-weight:700; letter-spacing:-.02em;
  font-size:28px; color:var(--amber); margin-bottom:14px;
}
#boot .mark small{display:block; font-size:11px; letter-spacing:.08em; color:#6d7a78; font-weight:500;}
#boot .bootrow{display:flex; gap:8px; white-space:nowrap;}
#boot .bootrow .dots{flex:1; overflow:hidden; color:#39433f;}
#boot .ok{color:var(--go);}
#boot .cur{display:inline-block; width:8px; height:15px; background:var(--amber); vertical-align:-3px; animation:blink 1s steps(1) infinite;}
@keyframes blink{50%{opacity:0}}
#boot.done{animation:bootOut .5s ease forwards;}
@keyframes bootOut{to{opacity:0; visibility:hidden;}}

/* ============================================================
   LOCK
   ============================================================ */
#lock{
  position:fixed; inset:0; z-index:8000;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  background:radial-gradient(120% 90% at 50% 0%, var(--desk-1), var(--desk-2));
  color:#eef2f1;
}
#lock .clock{font-size:clamp(48px,11vw,96px); font-weight:600; letter-spacing:-.04em; line-height:1;}
#lock .date{color:#8fa6a4; letter-spacing:.02em;}
#lock .avatar{
  width:62px;height:62px;border-radius:50%;
  background:linear-gradient(180deg,var(--shell-hi),var(--shell-lo));
  display:grid;place-items:center; font-weight:700; font-size:22px; color:#2a2e2f;
  border:1px solid rgba(255,255,255,.25);
  margin-top:14px;
}
#lock .name{font-weight:500;}
#lock.gone{display:none;}

/* ============================================================
   DESKTOP
   ============================================================ */
#desktop{
  position:fixed; inset:0 0 var(--bar) 0;
  overflow:hidden;
}
#wall{position:absolute; inset:0; background:var(--desk-2);}
#wall.w-grid{
  background:
    linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px) 0 0/28px 28px,
    linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px) 0 0/28px 28px,
    radial-gradient(120% 100% at 22% 0%, var(--desk-1), var(--desk-2));
}
#wall.w-dusk{background:linear-gradient(175deg,#20305e 0%,#4b3350 42%,#a05a4a 78%,#e2a35c 100%);}
#wall.w-topo{
  background:
    repeating-radial-gradient(circle at 30% 120%, transparent 0 26px, rgba(255,255,255,.055) 26px 27px),
    radial-gradient(110% 100% at 30% 10%, #10474f, #05171d);
}
#wall.w-slate{background:radial-gradient(100% 100% at 50% 0%, #33383b, #131617);}
#wall.w-pulp{
  background:
    repeating-linear-gradient(45deg, rgba(0,0,0,.05) 0 6px, transparent 6px 12px),
    linear-gradient(160deg,#c9633f,#7d2f3c 60%,#31182a);
}

#icons{
  position:absolute; inset:14px auto auto 14px;
  display:flex; flex-direction:column; flex-wrap:wrap;
  gap:4px; max-height:calc(100% - 28px); align-content:flex-start;
}
.dicon{
  width:82px; padding:9px 4px 7px; border-radius:8px;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  color:#f0f4f3; text-align:center; font-size:11.5px; font-weight:500;
  text-shadow:0 1px 3px rgba(0,0,0,.7);
  border:1px solid transparent;
}
.dicon:hover{background:rgba(255,255,255,.09);}
.dicon.sel{background:rgba(240,169,44,.2); border-color:rgba(240,169,44,.6);}
.dicon .glyph{
  width:40px;height:40px;border-radius:9px;
  background:linear-gradient(180deg,var(--shell-hi),var(--shell-lo));
  display:grid;place-items:center;
  border:1px solid rgba(0,0,0,.25);
  box-shadow:0 2px 5px rgba(0,0,0,.35), 0 1px 0 rgba(255,255,255,.5) inset;
  color:#24282a;
}
.dicon .glyph svg{width:21px;height:21px;}

/* ============================================================
   TASKBAR
   ============================================================ */
#taskbar{
  position:fixed; left:0; right:0; bottom:0; height:var(--bar); z-index:5000;
  display:flex; align-items:center; gap:6px; padding:0 8px;
  background:linear-gradient(180deg,var(--shell-hi),var(--shell));
  border-top:1px solid var(--edge);
  box-shadow:0 -2px 12px rgba(0,0,0,.3);
}
#startbtn{
  display:flex; align-items:center; gap:8px; padding:6px 12px 6px 9px;
  font-weight:600; letter-spacing:-.01em;
}
#startbtn .bird{width:19px;height:19px;color:var(--ink);}
#tasks{display:flex; gap:5px; flex:1; overflow:hidden; align-items:center;}
.taskbtn{
  display:flex; align-items:center; gap:7px; max-width:172px; padding:6px 12px;
  font-size:12.5px; white-space:nowrap; overflow:hidden;
}
.taskbtn svg{width:15px;height:15px;flex:none;}
.taskbtn span{overflow:hidden; text-overflow:ellipsis;}
.taskbtn .lamp{width:5px;height:5px;border-radius:50%;background:var(--edge);flex:none;}
.taskbtn.active .lamp{background:var(--amber); box-shadow:0 0 6px var(--amber);}
#tray{display:flex; align-items:center; gap:10px; padding-right:4px;}
.lampset{display:flex; gap:5px; align-items:center;}
.lampset i{width:7px;height:7px;border-radius:50%;background:var(--go);box-shadow:0 0 5px rgba(79,157,105,.8);}
.lampset i.a{background:var(--amber);box-shadow:0 0 5px rgba(240,169,44,.8);}
#trayclock{
  font-variant-numeric:tabular-nums; text-align:right; line-height:1.15; font-size:12px; padding:3px 8px;
  border-radius:var(--r-chip);
}
#trayclock b{display:block; font-weight:600; font-size:13px;}
#trayclock small{color:var(--dim); font-size:10.5px;}
#trayclock:hover{background:rgba(0,0,0,.06);}

/* ============================================================
   WINDOWS
   ============================================================ */
.win{
  position:absolute; display:flex; flex-direction:column;
  min-width:260px; min-height:150px;
  background:var(--shell);
  border:1px solid var(--edge);
  border-radius:var(--r-win);
  box-shadow:var(--shadow-win);
  overflow:hidden;
  animation:winIn .18s cubic-bezier(.2,.8,.3,1);
}
@keyframes winIn{from{opacity:0; transform:scale(.97) translateY(6px);}}
.win.min{animation:winMin .16s ease forwards;}
@keyframes winMin{to{opacity:0; transform:scale(.8) translateY(60px);}}
.win.closing{animation:winOut .14s ease forwards;}
@keyframes winOut{to{opacity:0; transform:scale(.96);}}
.win.hidden{display:none;}
.win.snapped,.win.maxed{border-radius:0;}

.titlebar{
  height:34px; flex:none; display:flex; align-items:center; gap:8px;
  padding:0 8px 0 11px;
  background:linear-gradient(180deg,var(--shell-hi),var(--shell));
  border-bottom:1px solid var(--edge);
  cursor:grab; touch-action:none;
}
.win.drag .titlebar{cursor:grabbing;}
.titlebar .tico{width:15px;height:15px;flex:none;opacity:.75;}
.titlebar .ttl{flex:1; font-size:12.5px; font-weight:600; letter-spacing:-.005em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.win:not(.focus) .titlebar{background:var(--shell); }
.win:not(.focus) .ttl{color:var(--dim);}
.wbtns{display:flex; gap:5px;}
.wbtn{
  width:17px;height:17px;border-radius:50%;
  border:1px solid rgba(0,0,0,.28);
  display:grid;place-items:center;
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset;
}
.wbtn svg{width:9px;height:9px;opacity:0;transition:opacity var(--t);color:rgba(0,0,0,.6);}
.wbtns:hover svg{opacity:1;}
.wbtn.mn{background:var(--amber);}
.wbtn.mx{background:var(--go);}
.wbtn.cl{background:var(--stop);}
.win:not(.focus) .wbtn{background:var(--shell-lo);}

.wbody{flex:1; overflow:auto; background:var(--paper); position:relative;}
.rz{position:absolute; z-index:3; touch-action:none;}
.rz.e{top:0;right:0;width:6px;height:100%;cursor:ew-resize;}
.rz.s{bottom:0;left:0;height:6px;width:100%;cursor:ns-resize;}
.rz.se{bottom:0;right:0;width:15px;height:15px;cursor:nwse-resize;}
.rz.w{top:0;left:0;width:6px;height:100%;cursor:ew-resize;}
.rz.n{top:0;left:0;height:4px;width:100%;cursor:ns-resize;}
#snapghost{
  position:fixed; z-index:4000; pointer-events:none; display:none;
  border:2px solid var(--amber); background:rgba(240,169,44,.14); border-radius:6px;
  transition:all 90ms ease;
}

/* ---------- shared app furniture ---------- */
.toolbar{
  display:flex; align-items:center; gap:6px; padding:7px 9px; flex:none;
  background:linear-gradient(180deg,var(--shell-hi),var(--shell));
  border-bottom:1px solid var(--edge); flex-wrap:wrap;
}
.toolbar .sp{flex:1;}
.toolbar .div{width:1px;height:20px;background:var(--edge);}
.tb-in{
  background:var(--paper); border:1px solid var(--edge); border-radius:var(--r-ctl);
  padding:5px 9px; box-shadow:0 1px 2px rgba(0,0,0,.14) inset; min-width:0;
}
.pad{padding:16px 18px;}
.stack{display:flex; flex-direction:column; height:100%;}
h2.appt{font-size:17px; font-weight:600; letter-spacing:-.015em; margin-bottom:3px;}
p.sub{color:var(--dim); margin-bottom:14px; max-width:62ch;}
.hint{color:var(--dim); font-size:11.5px;}
.chip{
  display:inline-flex; align-items:center; gap:5px;
  background:var(--paper-2); border:1px solid var(--edge); border-radius:var(--r-chip);
  padding:2px 7px; font-size:11px; font-family:var(--mono);
}

/* ---------- terminal ---------- */
.term{
  background:var(--field); color:var(--field-ink); font-family:var(--mono);
  font-size:12.5px; line-height:1.55; padding:12px 14px; height:100%; overflow:auto;
  user-select:text; cursor:text;
}
.term .p{color:var(--amber);}
.term .er{color:#e88b7d;}
.term .ok{color:#7fd39b;}
.term .mut{color:#63736f;}
.term pre{white-space:pre-wrap; word-break:break-word; font:inherit;}
.term .line{display:flex; gap:8px;}
.term input{
  flex:1; background:none; border:none; outline:none; font:inherit; color:var(--field-ink);
  caret-color:var(--amber);
}

/* ---------- files ---------- */
.fm{display:flex; height:100%;}
.fm .side{
  width:158px; flex:none; background:var(--paper-2); border-right:1px solid var(--edge);
  padding:9px 7px; overflow:auto;
}
.fm .side h4{font-size:11px; color:var(--dim); font-weight:600; padding:5px 7px 3px;}
.fm .side button{
  display:flex; align-items:center; gap:8px; width:100%; padding:6px 8px;
  border-radius:var(--r-ctl); font-size:12.5px; text-align:left;
}
.fm .side button svg{width:15px;height:15px;opacity:.65;}
.fm .side button:hover{background:rgba(0,0,0,.06);}
.fm .side button.on{background:var(--shell); box-shadow:0 0 0 1px var(--edge) inset;}
.fm .main{flex:1; display:flex; flex-direction:column; min-width:0;}
.crumbs{display:flex; align-items:center; gap:3px; padding:7px 10px; border-bottom:1px solid var(--edge); font-family:var(--mono); font-size:11.5px; color:var(--dim); background:var(--paper-2); flex-wrap:wrap;}
.crumbs b{color:var(--ink); font-weight:500;}
.grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(94px,1fr));
  gap:4px; padding:12px; overflow:auto; align-content:start; flex:1;
}
.fitem{
  padding:11px 5px 8px; border-radius:8px; display:flex; flex-direction:column;
  align-items:center; gap:7px; text-align:center; font-size:11.5px; border:1px solid transparent;
  word-break:break-word;
}
.fitem svg{width:29px;height:29px; color:var(--dim);}
.fitem.dir svg{color:var(--amber);}
.fitem:hover{background:var(--paper-2);}
.fitem.sel{background:rgba(240,169,44,.16); border-color:var(--amber);}
.empty{padding:38px 18px; color:var(--dim); text-align:center; grid-column:1/-1;}

/* ---------- text editor ---------- */
.editor{
  width:100%; height:100%; border:none; outline:none; resize:none;
  padding:16px 20px; font-family:var(--mono); font-size:13px; line-height:1.7;
  background:var(--paper); color:var(--ink); user-select:text;
}
.statusbar{
  flex:none; display:flex; gap:14px; padding:5px 11px; font-size:11px; color:var(--dim);
  border-top:1px solid var(--edge); background:var(--paper-2); font-family:var(--mono);
}

/* ---------- calculator ---------- */
.calc{display:flex; flex-direction:column; height:100%; background:var(--shell); padding:10px; gap:9px;}
.calc .readout{
  background:#101b16; border-radius:var(--r-ctl); padding:12px 14px; text-align:right;
  font-family:var(--mono); color:#a8e6bd; box-shadow:0 2px 6px rgba(0,0,0,.35) inset;
  border:1px solid #060b09;
}
.calc .readout .sm{font-size:11px; color:#4f7a63; min-height:16px; overflow:hidden;}
.calc .readout .big{font-size:29px; font-weight:500; overflow:hidden; text-overflow:ellipsis;}
.calc .keys{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; flex:1;}
.calc .keys button{font-size:16px; font-weight:500; border-radius:var(--r-ctl); min-height:38px;}
.calc .keys .op{background:linear-gradient(180deg,#f6cd85,var(--amber)); border-color:#c9891f;}
.calc .keys .eq{background:linear-gradient(180deg,#7cc394,var(--go)); border-color:#3d7d53; color:#08160e;}

/* ---------- paint ---------- */
.paintwrap{background:var(--paper-2); height:100%; display:grid; place-items:center; overflow:auto; padding:12px;}
.paintwrap canvas{background:#fff; box-shadow:0 4px 16px rgba(0,0,0,.22); border:1px solid var(--edge); touch-action:none; cursor:crosshair;}
.swatches{display:flex; gap:4px;}
.sw{width:20px;height:20px;border-radius:var(--r-chip); border:1px solid rgba(0,0,0,.3); box-shadow:0 1px 2px rgba(0,0,0,.2);}
.sw.on{outline:2px solid var(--amber); outline-offset:1px;}

/* ---------- browser ---------- */
.bwrap{display:flex; flex-direction:column; height:100%;}
.page{padding:26px 30px; overflow:auto; flex:1; user-select:text; background:var(--paper);}
.page h1{font-size:26px; letter-spacing:-.025em; margin-bottom:6px; font-weight:700;}
.page h3{font-size:14px; margin:18px 0 6px; font-weight:600;}
.page p{max-width:66ch; margin-bottom:10px; color:var(--ink);}
.page a{color:#0d6b7a; cursor:pointer; text-decoration:underline; text-underline-offset:2px;}
html[data-theme="dark"] .page a{color:#6fd0dd;}
.page ul{margin:0 0 12px 18px;}
.page li{margin-bottom:4px;}
.page .card{border:1px solid var(--edge); border-radius:8px; padding:14px 16px; background:var(--paper-2); margin-bottom:10px; max-width:66ch;}
.page code{font-family:var(--mono); font-size:12px; background:var(--paper-2); padding:1px 5px; border-radius:3px; border:1px solid var(--edge);}

/* ---------- settings ---------- */
.set{display:flex; height:100%;}
.set .nav{width:132px; flex:none; background:var(--paper-2); border-right:1px solid var(--edge); padding:9px 7px;}
.set .nav button{display:block; width:100%; text-align:left; padding:7px 9px; border-radius:var(--r-ctl); font-size:12.5px;}
.set .nav button.on{background:var(--shell); box-shadow:0 0 0 1px var(--edge) inset; font-weight:600;}
.set .body{flex:1; overflow:auto; padding:18px 20px;}
.row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:11px 0; border-bottom:1px solid var(--edge);}
.row:last-child{border-bottom:none;}
.row .lbl{font-weight:500;}
.row .desc{color:var(--dim); font-size:11.5px;}
.walls{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}
.wallsw{width:74px;height:46px;border-radius:6px;border:1px solid var(--edge); box-shadow:0 2px 5px rgba(0,0,0,.2);}
.wallsw.on{outline:2px solid var(--amber); outline-offset:2px;}
.toggle{width:42px;height:23px;border-radius:12px;background:var(--shell-lo);border:1px solid var(--edge);position:relative;transition:background var(--t); flex:none;}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform var(--t);}
.toggle.on{background:var(--go);}
.toggle.on::after{transform:translateX(19px);}

/* ---------- snake ---------- */
.game{display:flex; flex-direction:column; align-items:center; gap:11px; padding:14px; background:var(--paper-2); height:100%; overflow:auto;}
.game canvas{background:#0f1a16; border-radius:8px; border:1px solid var(--edge); box-shadow:0 6px 18px rgba(0,0,0,.3); max-width:100%; touch-action:none;}
.scorebar{display:flex; gap:20px; font-family:var(--mono); font-size:12px;}
.scorebar b{font-size:16px; display:block;}
.dpad{display:grid; grid-template-columns:repeat(3,44px); grid-template-rows:repeat(2,40px); gap:5px;}
.dpad button{border-radius:var(--r-ctl); display:grid; place-items:center;}

/* ---------- studio (music) ---------- */
.seq{padding:12px; overflow:auto; height:100%; background:var(--paper-2);}
.track{display:flex; align-items:center; gap:7px; margin-bottom:6px;}
.track .nm{width:52px; font-size:11px; font-family:var(--mono); color:var(--dim); flex:none;}
.steps{display:flex; gap:3px;}
.step{
  width:22px;height:26px;border-radius:var(--r-chip); flex:none;
  background:var(--shell); border:1px solid var(--edge);
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset;
}
.step.beat{background:var(--shell-lo);}
.step.on{background:linear-gradient(180deg,#f6cd85,var(--amber)); border-color:#c9891f;}
.step.cur{outline:2px solid var(--go); outline-offset:1px;}

/* ============================================================
   START MENU · MENUS · TOASTS
   ============================================================ */
#start{
  position:fixed; bottom:calc(var(--bar) + 7px); left:8px; z-index:6000;
  width:min(340px, calc(100vw - 16px));
  background:var(--shell); border:1px solid var(--edge); border-radius:12px;
  box-shadow:var(--shadow-win); overflow:hidden; display:none;
}
#start.open{display:block; animation:menuIn .14s cubic-bezier(.2,.8,.3,1);}
@keyframes menuIn{from{opacity:0; transform:translateY(8px) scale(.98);}}
#start .head{padding:11px 13px 9px; border-bottom:1px solid var(--edge); background:linear-gradient(180deg,var(--shell-hi),var(--shell));}
#start .head input{width:100%; }
#start .list{max-height:min(52vh,380px); overflow:auto; padding:7px;}
#start .list button{
  display:flex; align-items:center; gap:10px; width:100%; padding:8px 9px;
  border-radius:var(--r-ctl); text-align:left;
}
#start .list button:hover, #start .list button.hl{background:var(--shell-hi); box-shadow:0 0 0 1px var(--edge) inset;}
#start .list .gl{width:28px;height:28px;border-radius:7px;background:var(--paper); display:grid;place-items:center; border:1px solid var(--edge); flex:none;}
#start .list .gl svg{width:15px;height:15px;}
#start .list .nm{font-weight:500; font-size:12.5px;}
#start .list .ds{font-size:11px; color:var(--dim);}
#start .foot{display:flex; gap:6px; padding:8px 9px; border-top:1px solid var(--edge); background:var(--paper-2);}
#start .foot .who{flex:1; display:flex; align-items:center; gap:8px; font-size:12px; padding-left:3px;}
#start .foot .av{width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,var(--shell-hi),var(--shell-lo));display:grid;place-items:center;font-size:11px;font-weight:700;border:1px solid var(--edge);}

#ctx{
  position:fixed; z-index:7000; display:none; min-width:186px; padding:5px;
  background:var(--shell); border:1px solid var(--edge); border-radius:9px; box-shadow:var(--shadow-win);
}
#ctx.open{display:block; animation:menuIn .1s ease;}
#ctx button{display:flex; width:100%; justify-content:space-between; gap:16px; padding:6px 9px; border-radius:var(--r-ctl); font-size:12.5px; text-align:left;}
#ctx button:hover{background:var(--shell-hi);}
#ctx button kbd{color:var(--dim); font-family:var(--mono); font-size:10.5px;}
#ctx hr{border:none; border-top:1px solid var(--edge); margin:4px 2px;}

#toasts{position:fixed; right:12px; bottom:calc(var(--bar) + 12px); z-index:7500; display:flex; flex-direction:column; gap:8px; align-items:flex-end;}
.toast{
  background:var(--shell); border:1px solid var(--edge); border-radius:9px;
  box-shadow:var(--shadow-win); padding:10px 13px; max-width:290px;
  display:flex; gap:10px; align-items:flex-start;
  animation:toastIn .2s cubic-bezier(.2,.8,.3,1);
}
.toast.out{animation:toastOut .25s ease forwards;}
@keyframes toastIn{from{opacity:0; transform:translateX(20px);}}
@keyframes toastOut{to{opacity:0; transform:translateX(20px);}}
.toast .lamp{width:8px;height:8px;border-radius:50%;background:var(--amber);margin-top:5px;flex:none;box-shadow:0 0 6px var(--amber);}
.toast .t{font-weight:600; font-size:12.5px;}
.toast .m{font-size:12px; color:var(--dim);}

/* ---------- modal ---------- */
#modal{position:fixed; inset:0; z-index:7600; display:none; place-items:center; background:rgba(0,0,0,.4);}
#modal.open{display:grid;}
#modal .box{background:var(--shell); border:1px solid var(--edge); border-radius:11px; box-shadow:var(--shadow-win); width:min(380px,calc(100vw - 32px)); padding:16px 17px;}
#modal h3{font-size:14.5px; margin-bottom:5px;}
#modal p{font-size:12.5px; color:var(--dim); margin-bottom:12px;}
#modal input{width:100%; margin-bottom:13px;}
#modal .acts{display:flex; gap:7px; justify-content:flex-end;}

/* ---------- terminal extras ---------- */
.term .hl{color:var(--amber); font-weight:700;}
.term .wr{color:#e8c07d;}
.term .line .p{white-space:pre;}

/* ---------- code ---------- */
:root{
  --code-bg:#fbfaf7; --code-gut:#f1efe9; --code-line:rgba(240,169,44,.09);
  --code-sel:rgba(240,169,44,.3); --code-mark:rgba(240,169,44,.38);
  --syn-kw:#a3401c; --syn-str:#2e7a47; --syn-num:#8a4fb0; --syn-com:#8d9391; --syn-fn:#1f6a86;
  --syn-type:#9a6400; --syn-tag:#a3401c; --syn-attr:#86620a; --syn-prop:#1f6a86; --syn-lit:#8a4fb0; --syn-op:#6c7072;
}
html[data-theme="dark"]{
  --code-bg:#15181a; --code-gut:#1a1d1f; --code-line:rgba(255,255,255,.045);
  --code-sel:rgba(240,169,44,.3); --code-mark:rgba(240,169,44,.35);
  --syn-kw:#f0a36b; --syn-str:#9fd49b; --syn-num:#d3a6f5; --syn-com:#6b7773; --syn-fn:#7cc7e0;
  --syn-type:#f2c86b; --syn-tag:#f0a36b; --syn-attr:#e6c07b; --syn-prop:#7cc7e0; --syn-lit:#d3a6f5; --syn-op:#9aa0a2;
}
[hidden]{display:none !important;}
.cx-app{display:flex; flex-direction:column; height:100%;}
.cx-app .toolbar .ctl svg{width:14px; height:14px; vertical-align:-2px;}
.cx-main{flex:1; display:flex; min-height:0; position:relative;}
.cx-side{width:200px; flex:none; display:flex; flex-direction:column; background:var(--paper-2); border-right:1px solid var(--edge); min-height:0;}
.cx-app.noside .cx-side{display:none;}
.cx-sidehead{display:flex; align-items:center; gap:2px; padding:6px 5px 5px 10px; font-size:10.5px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:.07em;}
.cx-sidehead span{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cx-sidehead button{width:22px; height:22px; border-radius:5px; display:grid; place-items:center; color:var(--dim);}
.cx-sidehead button:hover{background:var(--shell); color:var(--ink);}
.cx-sidehead svg{width:14px; height:14px;}
.cx-tree{flex:1; overflow:auto; padding:0 4px 10px;}
.cx-node{display:flex; align-items:center; gap:5px; width:100%; padding:3px 6px; border-radius:5px; font-size:12.5px; text-align:left; white-space:nowrap;}
.cx-node:hover{background:rgba(0,0,0,.06);}
html[data-theme="dark"] .cx-node:hover{background:rgba(255,255,255,.06);}
.cx-node.on{background:var(--shell); box-shadow:0 0 0 1px var(--edge) inset;}
.cx-node svg{width:14px; height:14px; flex:none; color:var(--dim);}
.cx-node.dir svg.fi{color:var(--amber);}
.cx-node svg.tw{width:10px; height:10px; transition:transform var(--t);}
.cx-node svg.tw.open{transform:rotate(90deg);}
.cx-node svg.tw.none{visibility:hidden;}
.cx-node span{overflow:hidden; text-overflow:ellipsis;}
.cx-center{flex:1; display:flex; flex-direction:column; min-width:0; position:relative;}
.cx-tabs{display:flex; background:var(--paper-2); border-bottom:1px solid var(--edge); overflow-x:auto; flex:none; min-height:31px;}
.cx-tabs::-webkit-scrollbar{height:4px;}
.cx-tab{display:flex; align-items:center; gap:6px; padding:0 5px 0 10px; height:31px; font-size:12px; color:var(--dim); border-right:1px solid var(--edge); white-space:nowrap; flex:none;}
.cx-tab.on{background:var(--code-bg); color:var(--ink); box-shadow:inset 0 2px 0 var(--amber);}
.cx-tab svg{width:13px; height:13px;}
.cx-tab .x{width:18px; height:18px; border-radius:4px; display:grid; place-items:center; color:var(--dim);}
.cx-tab .x:hover{background:rgba(0,0,0,.1); color:var(--ink);}
.cx-tab .x svg{width:10px; height:10px;}
.cx-tab.dirty .x svg{display:none;}
.cx-tab.dirty .x::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor;}
.cx-tab.dirty .x:hover::before{display:none;}
.cx-tab.dirty .x:hover svg{display:block;}
.cx-edarea{flex:1; position:relative; min-height:0; background:var(--code-bg);}
.cx-host{position:absolute; inset:0;}
.cx-empty{position:absolute; inset:0; display:grid; place-items:center; text-align:center; color:var(--dim); padding:20px;}
.cx-empty h3{color:var(--ink); font-size:15px; margin-bottom:6px; font-weight:600;}
.cx-empty p{margin-bottom:12px;}
.cx-empty .acts{display:flex; gap:7px; justify-content:center; flex-wrap:wrap;}
.cx-empty kbd, .page kbd{font-family:var(--mono); font-size:10.5px; border:1px solid var(--edge); border-bottom-width:2px; border-radius:4px; padding:0 4px; background:var(--paper-2); color:var(--ink);}

.cx-ed{position:absolute; inset:0; display:flex; font-family:var(--mono); font-size:12.5px; line-height:19px; tab-size:2; -moz-tab-size:2; font-variant-ligatures:none;}
.cx-gut{flex:none; position:relative; overflow:hidden; background:var(--code-gut); border-right:1px solid var(--edge); color:var(--dim); text-align:right; user-select:none; font-size:11.5px;}
.cx-nums{padding:10px 9px 60px 8px; white-space:pre; will-change:transform; opacity:.75;}
.cx-curnum{position:absolute; left:0; right:0; padding:0 9px 0 8px; height:19px; color:var(--ink); background:var(--code-gut);}
.cx-body{position:relative; flex:1; min-width:0; overflow:hidden;}
.cx-cur{position:absolute; left:0; right:0; top:0; height:19px; background:var(--code-line); pointer-events:none;}
.cx-layers{position:absolute; top:0; left:0; will-change:transform; pointer-events:none;}
.cx-layers pre{position:absolute; top:0; left:0; margin:0; padding:10px 14px; font:inherit; line-height:inherit; white-space:pre; tab-size:inherit; -moz-tab-size:inherit; color:var(--ink);}
.cx-layers .cx-marks{color:transparent;}
.cx-marks mark{background:var(--code-mark); color:transparent; border-radius:2px;}
.cx-marks mark.cur{background:transparent; box-shadow:0 0 0 1.5px var(--amber); background:var(--code-mark);}
.cx-ta{position:absolute; inset:0; width:100%; height:100%; margin:0; padding:10px 14px; border:0; outline:none; resize:none; background:transparent; color:transparent; -webkit-text-fill-color:transparent; caret-color:var(--ink); font:inherit; line-height:inherit; white-space:pre; overflow:auto; tab-size:inherit; -moz-tab-size:inherit; user-select:text; z-index:1; font-variant-ligatures:none;}
.cx-ta::selection{background:var(--code-sel); -webkit-text-fill-color:transparent;}
.cx-measure{position:absolute; visibility:hidden; white-space:pre;}
.t-kw{color:var(--syn-kw);} .t-str{color:var(--syn-str);} .t-num{color:var(--syn-num);}
.t-com{color:var(--syn-com); font-style:italic;} .t-fn{color:var(--syn-fn);} .t-type{color:var(--syn-type);}
.t-tag{color:var(--syn-tag);} .t-attr{color:var(--syn-attr);} .t-prop{color:var(--syn-prop);}
.t-lit{color:var(--syn-lit);} .t-op{color:var(--syn-op);} .t-h{color:var(--syn-kw);} .t-b{color:var(--syn-type);} .t-i{font-style:italic;}

.cx-find{display:flex; align-items:center; gap:4px; padding:5px 8px; background:var(--paper-2); border-bottom:1px solid var(--edge); flex-wrap:wrap; font-size:12px; flex:none;}
.cx-find .tb-in{width:170px; padding:3px 7px; font-family:var(--mono); font-size:12px;}
.cx-find button{padding:2px 7px; border-radius:5px; border:1px solid transparent; font-size:11.5px; font-family:var(--mono);}
.cx-find button:hover{background:var(--shell);}
.cx-find button.on{border-color:var(--amber); background:var(--shell);}
.cx-count{font-family:var(--mono); font-size:11px; color:var(--dim); min-width:58px; text-align:center;}
.cx-find .gap{width:10px;}

.cx-panel{height:150px; flex:none; display:flex; flex-direction:column; border-top:1px solid var(--edge); background:var(--field); color:var(--field-ink);}
.cx-panelhead{display:flex; align-items:center; gap:6px; padding:3px 8px; font-size:10.5px; color:#9fb0a9; border-bottom:1px solid #22302c; text-transform:uppercase; letter-spacing:.07em; flex:none;}
.cx-panelhead .sp{flex:1;}
.cx-panelhead button{color:#9fb0a9; padding:1px 7px; border-radius:4px; text-transform:none; letter-spacing:0; font-size:11.5px;}
.cx-panelhead button:hover{background:rgba(255,255,255,.08); color:#fff;}
.cx-log{flex:1; overflow:auto; padding:6px 10px; font-family:var(--mono); font-size:12px; line-height:1.5; white-space:pre-wrap; word-break:break-word; user-select:text;}
.cx-log .er{color:#e88b7d;} .cx-log .wr{color:#e8c07d;} .cx-log .ok{color:#7fd39b;} .cx-log .mut{color:#63736f;} .cx-log .hd{color:var(--amber);}
.cx-log a{color:#8fd0e0; cursor:pointer; text-decoration:underline; text-underline-offset:2px;}

.cx-prev{width:42%; min-width:220px; flex:none; display:flex; flex-direction:column; border-left:1px solid var(--edge); background:var(--paper-2);}
.cx-prevhead{display:flex; align-items:center; gap:6px; padding:4px 6px 4px 10px; font-size:11.5px; border-bottom:1px solid var(--edge); color:var(--dim); flex:none;}
.cx-prevhead b{color:var(--ink); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.cx-prevhead .sp{flex:1;}
.cx-prevhead button{padding:2px 7px; border-radius:5px; font-size:11.5px;}
.cx-prevhead button:hover{background:var(--shell);}
.cx-prev iframe{flex:1; border:0; background:#fff; width:100%;}

.cx-quick{position:absolute; top:8px; left:50%; transform:translateX(-50%); width:min(440px,92%); z-index:5; background:var(--shell); border:1px solid var(--edge); border-radius:9px; box-shadow:var(--shadow-win); padding:6px;}
.cx-quick input{width:100%;}
.cx-quick .ql{max-height:280px; overflow:auto; margin-top:5px;}
.cx-quick .ql button{display:flex; align-items:center; gap:8px; width:100%; padding:5px 8px; border-radius:5px; font-size:12.5px; text-align:left;}
.cx-quick .ql button svg{width:14px; height:14px; flex:none; color:var(--dim);}
.cx-quick .ql button.hl{background:var(--shell-hi); box-shadow:0 0 0 1px var(--edge) inset;}
.cx-quick .ql small{color:var(--dim); font-family:var(--mono); font-size:11px; margin-left:auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:55%;}
.statusbar .sp{flex:1;}

/* ---------- browser ---------- */
.bw{display:flex; flex-direction:column; height:100%;}
.bw-tabs{display:flex; align-items:flex-end; gap:3px; padding:5px 6px 0; background:var(--shell-lo); border-bottom:1px solid var(--edge); overflow-x:auto; flex:none;}
.bw-tabs::-webkit-scrollbar{height:0;}
.bw-tab{display:flex; align-items:center; gap:6px; width:170px; min-width:74px; flex:0 1 auto; padding:5px 5px 6px 10px; border:1px solid transparent; border-bottom:none; border-radius:7px 7px 0 0; font-size:12px; color:var(--dim); white-space:nowrap;}
.bw-tab:hover{background:rgba(255,255,255,.18);}
.bw-tab.on{background:var(--shell-hi); border-color:var(--edge); color:var(--ink); position:relative; top:1px;}
.bw-tab .tt{overflow:hidden; text-overflow:ellipsis; flex:1; text-align:left;}
.bw-tab svg{width:13px; height:13px; flex:none;}
.bw-tab .x{width:17px; height:17px; border-radius:4px; display:grid; place-items:center; flex:none;}
.bw-tab .x:hover{background:rgba(0,0,0,.12);}
.bw-tab .x svg{width:10px; height:10px;}
.bw-tab .spin{width:11px; height:11px; border-radius:50%; border:1.6px solid var(--amber); border-right-color:transparent; animation:spin .7s linear infinite; flex:none;}
@keyframes spin{to{transform:rotate(360deg);}}
.bw-new{width:26px; height:24px; border-radius:6px; display:grid; place-items:center; margin:0 0 4px 2px; flex:none;}
.bw-new:hover{background:rgba(255,255,255,.25);}
.bw-new svg{width:14px; height:14px;}
.bw .toolbar{position:relative; flex-wrap:nowrap; background:var(--shell-hi);}
.bw .toolbar .ctl{padding:5px 8px; display:grid; place-items:center;}
.bw .toolbar .ctl svg{width:15px; height:15px;}
.bw .toolbar .ctl:disabled{opacity:.4; pointer-events:none;}
.bw-addr{flex:1; display:flex; align-items:center; gap:6px; min-width:0; background:var(--paper); border:1px solid var(--edge); border-radius:var(--r-ctl); box-shadow:0 1px 2px rgba(0,0,0,.14) inset; padding:0 4px 0 8px;}
.bw-addr:focus-within{border-color:var(--amber);}
.bw-addr .chip{flex:none; padding:0 5px; font-size:10px;}
.bw-addr input{flex:1; min-width:0; border:0; outline:none; background:none; padding:5px 0; font-family:var(--mono); font-size:12px;}
.bw-addr button{width:24px; height:24px; display:grid; place-items:center; border-radius:5px; color:var(--dim);}
.bw-addr button:hover{background:var(--paper-2); color:var(--ink);}
.bw-addr button svg{width:15px; height:15px;}
.bw-addr button.on svg{fill:var(--amber); color:var(--amber);}
.bw-load{position:absolute; left:0; bottom:-1px; height:2px; width:28%; background:var(--amber); animation:bwload 1.1s ease-in-out infinite; display:none;}
.bw.loading .bw-load{display:block;}
@keyframes bwload{from{left:-28%;} to{left:100%;}}
.bw-view{flex:1; position:relative; background:var(--paper); min-height:0;}
.bw-pane{position:absolute; inset:0; display:flex; flex-direction:column;}
.bw-pane > iframe{flex:1; width:100%; border:0; background:#fff;}
.bw-pane > .page{flex:1; padding:0;}
.page-in{padding:24px 30px 30px;}
.bw-note{display:flex; align-items:center; gap:8px; padding:4px 6px 4px 10px; font-size:11.5px; color:var(--dim); background:var(--paper-2); border-bottom:1px solid var(--edge); flex:none;}
.bw-note span{flex:1;}
.bw-note button{padding:2px 8px; border-radius:5px; font-size:11.5px; color:var(--ink);}
.bw-note button:hover{background:var(--shell);}
.bw-home{max-width:660px; margin:0 auto; padding:34px 24px 30px;}
.bw-logo{font-size:30px; font-weight:700; letter-spacing:-.035em; text-align:center; margin-bottom:16px;}
.bw-logo b{color:var(--amber); font-weight:700;}
.bw-search{display:flex; gap:7px; margin-bottom:24px;}
.bw-search input{flex:1; padding:9px 13px; font-size:14px; border-radius:9px;}
.bw-tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:9px; margin-bottom:22px;}
.bw-tile{display:flex; flex-direction:column; align-items:center; gap:7px; padding:13px 8px 11px; border:1px solid var(--edge); border-radius:10px; background:var(--paper-2); font-size:12px; text-align:center; cursor:pointer; color:var(--ink); text-decoration:none; position:relative;}
.bw-tile:hover{border-color:var(--amber);}
.bw .page a.bw-tile, .bw .page a.bw-tile *{text-decoration:none; color:var(--ink);}
.bw .page a.bw-tile .fav{color:#fff;}
.bw .page a.bw-tile small{color:var(--dim);}
.bw-home .hint svg, .bw-err svg, .bw-note svg{width:13px; height:13px; vertical-align:-2px;}
.bw-tile .fav{width:34px; height:34px; border-radius:9px; display:grid; place-items:center; font-weight:700; font-size:15px; color:#fff; background:var(--c,#5b6b70);}
.bw-tile small{color:var(--dim); font-family:var(--mono); font-size:10px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bw-tile .rm{position:absolute; top:4px; right:4px; width:18px; height:18px; border-radius:4px; display:none; place-items:center; color:var(--dim);}
.bw-tile:hover .rm{display:grid;}
.bw-tile .rm:hover{background:var(--shell); color:var(--ink);}
.bw-tile .rm svg{width:10px; height:10px;}
.bw-sec{font-size:11px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:.07em; margin:0 0 8px;}
.bw-list{list-style:none; margin:0 0 20px !important; padding:0;}
.bw-list li{display:flex; gap:10px; align-items:baseline; padding:5px 0; border-bottom:1px solid var(--edge); margin:0 !important;}
.bw-list li small{color:var(--dim); font-family:var(--mono); font-size:10.5px; margin-left:auto; white-space:nowrap;}
.bw-err{max-width:520px; margin:60px auto; padding:0 24px; text-align:center;}
.bw-err h1{font-size:21px !important;}
.bw-err .acts{display:flex; gap:8px; justify-content:center; margin-top:16px; flex-wrap:wrap;}
.bw-raw{margin:0; padding:16px 18px; font-family:var(--mono); font-size:12.5px; white-space:pre-wrap; word-break:break-word; user-select:text; flex:1; overflow:auto; background:var(--paper);}
.bw-img{flex:1; display:grid; place-items:center; background:var(--paper-2); overflow:auto; padding:14px;}
.bw-img img{max-width:100%; box-shadow:0 4px 16px rgba(0,0,0,.25);}

@media (max-width:640px){
  :root{--bar:52px;}
  .cx-prev{position:absolute; inset:0; width:auto; z-index:4;}
  .cx-find .tb-in{width:120px;}
  .bw-tab{width:120px;}
  .fm .side, .set .nav{display:none;}
  .dicon{width:74px;}
  #tasks .taskbtn span{display:none;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}

</div>

const ico = (n, cls = "") =>

/* ============================================================
   1 · config + persistence
   ============================================================ */
const DEFAULT_CFG = {
  user: "operator",
  theme: "light",
  wall: "w-grid",
  accent: "#f0a92c",
  motion: true,
  snakeHigh: 0,
  visits: 0,
  hist: [],
  bookmarks: null,
  bhist: [],
  seed: 0
};
let cfg = { ...DEFAULT_CFG };
let FS = {};

const KEY = "kestrel:v1";
const store = {
  async get() {
    if (window.storage && window.storage.get) { const r = await window.storage.get(KEY); return r && r.value; }
    return localStorage.getItem(KEY);
  },
  async set(v) {
    if (window.storage && window.storage.set) return window.storage.set(KEY, v);
    localStorage.setItem(KEY, v);
  }
};
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try { await store.set(JSON.stringify({ cfg, FS })); } catch (e) { /* session only */ }
  }, 400);
}
// arrays in cfg must never be shared with DEFAULT_CFG, and old saves may not have them at all
function normCfg() {
  cfg.hist = Array.isArray(cfg.hist) ? cfg.hist.slice(-500) : [];
  cfg.bhist = Array.isArray(cfg.bhist) ? cfg.bhist.slice(-80) : [];
  cfg.bookmarks = Array.isArray(cfg.bookmarks) ? cfg.bookmarks.map(b => ({ ...b })) : DEFAULT_BOOKMARKS.map(b => ({ ...b }));
}
async function loadState() {
  try {
    const raw = await store.get();
    if (raw) {
      const d = JSON.parse(raw);
      if (d.cfg) cfg = { ...DEFAULT_CFG, ...d.cfg };
      // older saves were written with a broken path normaliser; only trust a disk that has a home folder
      if (d.FS && d.FS["/"] && d.FS[HOME]) FS = d.FS;
      return !!FS[HOME];
    }
  } catch (e) { /* first boot or storage unavailable */ }
  return false;
}

/* ============================================================
   2 · virtual filesystem  (flat map, path keys)
   ============================================================ */
const HOME = "/home/operator";
const norm = p => {
  const parts = [];
  for (const seg of String(p).split("/")) {
    if (!seg || seg === ".") continue;
    if (seg === "..") parts.pop(); else parts.push(seg);
  }
  return "/" + parts.join("/");
};
function resolve(p, cwd) {
  if (!p) return cwd;
  if (p === "~") return HOME;
  if (p.startsWith("~/")) p = HOME + p.slice(1);
  const parts = [];
  const base = p.startsWith("/") ? [] : cwd.split("/").filter(Boolean);
  for (const seg of [...base, ...p.split("/")]) {
    if (!seg || seg === ".") continue;
    if (seg === "..") parts.pop(); else parts.push(seg);
  }
  return "/" + parts.join("/");
}
const dirname  = p => p === "/" ? "/" : (p.slice(0, p.lastIndexOf("/")) || "/");
const basename = p => p === "/" ? "/" : p.slice(p.lastIndexOf("/") + 1);
const join     = (dir, name) => dir === "/" ? "/" + name : dir + "/" + name;
const exists   = p => !!FS[p];
const isDir    = p => FS[p] && FS[p].t === "d";
const childrenOf = p => Object.keys(FS)
  .filter(k => k !== "/" && dirname(k) === p)
  .sort((a, b) => (isDir(b) - isDir(a)) || basename(a).localeCompare(basename(b)));

function mkdir(p) {
  p = norm(p);
  const chain = [];
  let cur = p;
  while (cur !== "/" && !exists(cur)) { chain.unshift(cur); cur = dirname(cur); }
  chain.forEach(c => FS[c] = { t: "d", m: Date.now() });
  save();
  return p;
}
function writeFile(p, content, kind = "txt") {
  p = norm(p);
  mkdir(dirname(p));
  FS[p] = { t: "f", k: kind, c: content, m: Date.now() };
  save();
  return p;
}
const readFile = p => (FS[p] && FS[p].t === "f") ? FS[p].c : null;
function rm(p) {
  if (p === "/" || p === HOME) return false;
  Object.keys(FS).forEach(k => { if (k === p || k.startsWith(p + "/")) delete FS[k]; });
  save();
  return true;
}
function moveTo(from, to) {
  to = norm(to);
  if (!exists(from) || from === "/" || from === HOME) return false;
  if (to === from || to.startsWith(from + "/") || exists(to) || !isDir(dirname(to))) return false;
  const keys = Object.keys(FS).filter(k => k === from || k.startsWith(from + "/"));
  keys.forEach(k => { FS[to + k.slice(from.length)] = FS[k]; delete FS[k]; });
  save();
  return true;
}
function uniqueName(dir, name) {
  let n = name, i = 2;
  const dot = name.lastIndexOf(".");
  const stem = dot > 0 ? name.slice(0, dot) : name;
  const ext  = dot > 0 ? name.slice(dot) : "";
  while (exists(join(dir, n))) n = `${stem} ${i++}${ext}`;
  return n;
}
const fileKind = p => {
  const f = FS[p];
  if (!f) return "file";
  if (f.t === "d") return "folder";
  if (f.k === "img") return "image";
  return "text";
};

function seedFS() {
  FS = { "/": { t: "d", m: Date.now() } };
  ["/home", HOME, HOME + "/Documents", HOME + "/Pictures", HOME + "/Projects", "/system", "/system/logs"].forEach(mkdir);
  writeFile(HOME + "/Documents/readme.txt",
`Kestrel OS 1.0
==============

Everything here is real, in the sense that it actually runs. There is
no server: the filesystem lives in memory and is written back to
browser storage whenever you change something.

Things worth trying

  · Code       open Projects/hello-web and press Preview
  · Browser    search the web, or open a page you wrote
  · Files      double click anything, or right click for a menu
  · Studio     make a beat, then press play

Drag a window to the top edge to maximise it, or to the left or
right edge to snap it to half the screen.`);
  writeFile(HOME + "/Documents/notes.txt", "Scratch pad.\n\nShopping:\n- solder\n- 2x 470 ohm resistors\n- coffee\n");
  writeFile(HOME + "/Projects/todo.txt", "[ ] finish the gearbox\n[ ] rewrite the parser\n[x] boot the machine\n");
  writeFile("/system/logs/boot.log", "kernel: cold start ok\nfs: mounted / as memfs\nwm: compositor online\n");
  seedV2();
  save();
}
// sample projects and a shell profile; also added (once) to disks made before they existed
function seedV2() {
  for (const [rel, text] of Object.entries(SAMPLES)) { const p = HOME + "/" + rel; if (!exists(p)) writeFile(p, text); }
}

const SAMPLES = {

  "Projects/hello-web/about.html": "\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\n\u003chead>\n  \u003cmeta charset=\"utf-8\">\n  \u003ctitle>About\u003c/title>\n  \u003clink rel=\"stylesheet\" href=\"style.css\">\n\u003c/head>\n\u003cbody>\n  \u003cmain>\n    \u003ch1>A second page\u003c/h1>\n    \u003cp>Links between your own pages work in the preview and in Browser.\u003c/p>\n    \u003cp>\u003ca href=\"index.html\">Back to the first page\u003c/a>\u003c/p>\n  \u003c/main>\n\u003c/body>\n\u003c/html>\n",

  "Projects/hello-web/app.js": "const btn = document.getElementById(\"btn\");\nlet clicks = 0;\n\nbtn.addEventListener(\"click\", () => {\n  clicks++;\n  btn.textContent = `Clicked ${clicks} time${clicks === 1 ? \"\" : \"s\"}`;\n  console.log(\"click\", clicks);\n});\n\nconsole.log(\"app.js loaded\");\n",
  "Projects/scripts/fib.js": "// Run it: press Ctrl+Enter in Code, or type `js fib.js 40` in Terminal.\nconst n = Number(process.argv[2] || 20);\n\nfunction fib(k) {\n  let [a, b] = [0n, 1n];\n  for (let i = 0; i \u003c k; i++) [a, b] = [b, a + b];\n  return a;\n}\n\nfor (let i = 1; i \u003c= n; i++) {\n  console.log(String(i).padStart(3), fib(i).toString());\n}\n",
  "Projects/scripts/wordcount.js": "// Counts the words in a file and writes a report next to this script.\n// Terminal: js wordcount.js ~/Documents/readme.txt\nconst fs = require(\"fs\");\n\nconst file = process.argv[2] || process.env.HOME + \"/Documents/readme.txt\";\nconst text = fs.readFileSync(file, \"utf8\");\n\nconst counts = {};\nfor (const word of text.toLowerCase().match(/[a-z']+/g) || []) {\n  counts[word] = (counts[word] || 0) + 1;\n}\n\nconst top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 10);\nconsole.table(top.map(([word, n]) => ({ word, n })));\n\nfs.writeFileSync(\"wordcount-report.txt\", top.map(([w, n]) => `${n}\\t${w}`).join(\"\\n\") + \"\\n\");\nconsole.log(\"wrote wordcount-report.txt\");\n",
  "Projects/scripts/hello.sh": "# A small ksh script. Run it with: sh hello.sh\necho \"Hello, $USER. Today is $(date +%A).\"\n\nfor f in *.js; do\n  lines=$(wc -l \u003c $f)\n  echo \"  $f has $lines lines\"\ndone\n\nif [ -d ~/Projects/hello-web ]; then\n  echo \"hello-web is here, open it with: code ~/Projects/hello-web\"\nfi\n",
  "Projects/scripts/weather.sh": "# Usage: sh weather.sh [city]\ncity=${1:-London}\necho \"Weather for $city\"\ncurl -s \"https://wttr.in/$city?format=3\"\n"
};

/* ============================================================
   3 · toasts + modal
   ============================================================ */
function toast(title, msg) {
  const t = el("div", "toast", `<span class="lamp"></span><div><div class="t">${esc(title)}</div>${msg ? `<div class="m">${esc(msg)}</div>` : ""}</div>`);
  $("#toasts").appendChild(t);
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 260); }, 3200);
}

function ask({ title, msg = "", value = "", ok = "OK", input = true }) {
  return new Promise(res => {
    const m = $("#modal");
    $("#mtitle").textContent = title;
    $("#mmsg").textContent = msg;
    $("#mmsg").style.display = msg ? "" : "none";
    const inp = $("#minput");
    inp.style.display = input ? "" : "none";
    inp.value = value;
    $("#mok").textContent = ok;
    m.classList.add("open");
    setTimeout(() => input ? inp.focus() : $("#mok").focus(), 30);
    const done = v => { m.classList.remove("open"); cleanup(); res(v); };
    const onOk = () => done(input ? inp.value : true);
    const onNo = () => done(null);
    const onKey = e => { if (e.key === "Enter") onOk(); if (e.key === "Escape") onNo(); };
    function cleanup() {
      $("#mok").removeEventListener("click", onOk);
      $("#mcancel").removeEventListener("click", onNo);
      m.removeEventListener("keydown", onKey);
    }
    $("#mok").addEventListener("click", onOk);
    $("#mcancel").addEventListener("click", onNo);
    m.addEventListener("keydown", onKey);
  });
}

/* ============================================================
   4 · window manager
   ============================================================ */
const APPS = {};
const wins = new Map();
let zTop = 100, winSeq = 0, focused = null;
const desk = () => $("#desktop").getBoundingClientRect();
const isSmall = () => window.innerWidth < 700;

function openWindow(opt) {
  const id = "w" + (++winSeq);
  const d = desk();
  let w = Math.min(opt.w || 560, d.width - 20);
  let h = Math.min(opt.h || 380, d.height - 20);
  const off = (wins.size % 6) * 26;
  let x = clamp((d.width - w) / 2 + off - 60, 8, Math.max(8, d.width - w - 8));
  let y = clamp(46 + off, 8, Math.max(8, d.height - h - 8));

  const n = el("div", "win");
  n.id = id;
  Object.assign(n.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
  n.innerHTML = `
    <div class="titlebar">
      ${ico(opt.icon || "app", "tico")}
      <span class="ttl">${esc(opt.title)}</span>
      <div class="wbtns">
        <button class="wbtn mn" title="Minimise" data-a="min">${ico("minus")}</button>
        <button class="wbtn mx" title="Maximise" data-a="max">${ico("square")}</button>
        <button class="wbtn cl" title="Close" data-a="close">${ico("x")}</button>
      </div>
    </div>
    <div class="wbody"></div>
    <div class="rz n"></div><div class="rz e"></div><div class="rz s"></div>

    const prompt = () => `${cfg.user}@kestrel ${short()} $ `;
    const setPrompt = t => { ps.textContent = t; };
    const idle = () => { running = false; reader = null; setPrompt(prompt()); setWinTitle(win, "Terminal · " + short()); };
    const echoLine = (p, line) => { block = null; print(p, "p"); print(line + "\n"); block = null; };

    async function submit(raw) {
      if (reader) {
        const r = reader; reader = null;
        echoLine(ps.textContent, raw);
        setPrompt("");
        r.res(raw);
        return;
      }
      if (running) return;
      let line = raw;
      echoLine(prompt(), raw);
      try { line = sh.expandHistory(raw); } catch (e) { print(`ksh: ${e.message}\n`, "er"); return; }
      if (line !== raw) print(line + "\n", "mut");
      if (line.trim()) {
        if (cfg.hist[cfg.hist.length - 1] !== line) { cfg.hist.push(line); if (cfg.hist.length > 500) cfg.hist.splice(0, cfg.hist.length - 500); save(); }
      }
      hi = cfg.hist.length; draft = "";
      if (!line.trim()) return;
      running = true; setPrompt("");
      block = null;
      // an interrupted run finishes later; the token stops it from resetting a newer command's prompt
      const my = ++runId;
      await sh.run(line);
      if (my !== runId || !wins.has(win.id)) return;
      block = null;
      idle();
    }

    inp.addEventListener("keydown", e => {
      const k = e.key;
      if (searching) {
        if (k === "Enter" || k === "Escape" || k === "Tab") {
          e.preventDefault();
          const hit = searching.hit; searching = null; setPrompt(running ? "" : prompt());
          inp.value = k === "Escape" ? "" : hit || "";
          if (k === "Enter" && hit) { inp.value = ""; submit(hit); }
          return;
        }
        if (k === "r" && e.ctrlKey) { e.preventDefault(); searching.from = searching.idx - 1; }
        setTimeout(() => {
          if (!searching) return;
          const q = inp.value;
          let i = Math.min(searching.from ?? cfg.hist.length - 1, cfg.hist.length - 1);
          for (; i >= 0; i--) if (q && cfg.hist[i].includes(q)) break;
          searching.idx = i; searching.from = undefined; searching.hit = i >= 0 ? cfg.hist[i] : "";
          setPrompt(`(search)'${q}': ${searching.hit || ""}  `);
        });
        return;
      }
      if (k === "Enter") { e.preventDefault(); if (running && !reader) return; const v = inp.value; inp.value = ""; submit(v); }
      else if (k === "c" && e.ctrlKey && !e.shiftKey && !String(getSelection())) {
        e.preventDefault();
        if (reader) { const r = reader; reader = null; block = null; print(ps.textContent + inp.value + "^C\n", "mut"); block = null; inp.value = ""; sh.interrupt(); r.res(null); return; }
        if (running) { runId++; sh.interrupt(); print("^C\n", "mut"); block = null; idle(); }
        else { echoLine(prompt(), inp.value + "^C"); inp.value = ""; }
      }
      else if (k === "d" && e.ctrlKey && !inp.value) {
        e.preventDefault();
        if (reader) { const r = reader; reader = null; print("\n"); r.res(null); }
        else if (!running) closeWindow(win.id, true);
      }
      else if (k === "l" && e.ctrlKey) { e.preventDefault(); out.innerHTML = ""; block = null; }
      else if (k === "u" && e.ctrlKey) { e.preventDefault(); inp.value = inp.value.slice(inp.selectionStart); inp.setSelectionRange(0, 0); }
      else if (k === "a" && e.ctrlKey) { e.preventDefault(); inp.setSelectionRange(0, 0); }
      else if (k === "e" && e.ctrlKey) { e.preventDefault(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      else if (k === "r" && e.ctrlKey) { e.preventDefault(); searching = { idx: cfg.hist.length, hit: "" }; inp.value = ""; setPrompt("(search)'': "); }
      else if (k === "ArrowUp" && !reader) {
        e.preventDefault();
        if (hi === cfg.hist.length) draft = inp.value;
        if (hi > 0) { inp.value = cfg.hist[--hi]; requestAnimationFrame(() => inp.setSelectionRange(inp.value.length, inp.value.length)); }
      }
      else if (k === "ArrowDown" && !reader) {
        e.preventDefault();
        if (hi < cfg.hist.length - 1) inp.value = cfg.hist[++hi];
        else { hi = cfg.hist.length; inp.value = draft; }
      }
      else if (k === "Tab") {
        e.preventDefault();
        if (reader || running) return;
        const r = sh.complete(inp.value, inp.selectionStart);
        if (!r) return;
        if (r.options) { echoLine(prompt(), inp.value); print(r.options.join("   ") + "\n", "mut"); block = null; }
        else { inp.value = r.line; inp.setSelectionRange(r.pos, r.pos); }
      }
    });
    term.addEventListener("pointerup", e => { if (!String(getSelection()).length && e.target.tagName !== "A") inp.focus({ preventScroll: true }); });
    body.addEventListener("keydown", e => { if (e.target !== inp && !e.ctrlKey && !e.metaKey && e.key.length === 1) inp.focus(); });

    (async () => {
      print("Kestrel shell", "ok"); print(" · "); print("help", "p"); print(" lists commands · "); print("Tab", "p"); print(" completes · "); print("Ctrl+C", "p"); print(" stops\n");
      block = null;
      const rc = HOME + "/.kshrc";
      if (exists(rc)) { running = true; await sh.run("source ~/.kshrc"); block = null; }
      idle();
      if (opt.run) { inp.value = ""; await submit(opt.run); }
      setTimeout(() => inp.focus(), 60);
    })();
    return () => sh.interrupt();
  }
};

    const nameOk = v => v && !/[/\\]/.test(v);
    async function newFile(dir = active ? dirname(active.path) : root) {
      const v = (await ask({ title: "New file", msg: "In " + dir.replace(HOME, "~"), value: uniqueName(dir, "untitled.js") }) || "").trim();
      if (!nameOk(v)) return v && toast("Bad name", "Names can't contain slashes");
      const p = join(dir, v);
      if (exists(p)) return toast("Already exists", v);
      writeFile(p, ""); expanded.add(dir); refreshFiles(); openFile(p);
    }
    async function newFolder(dir = root) {
      const v = (await ask({ title: "New folder", value: uniqueName(dir, "new folder") }) || "").trim();
      if (!nameOk(v)) return;
      const p = join(dir, v);
      if (exists(p)) return toast("Already exists", v);
      mkdir(p); expanded.add(dir); expanded.add(p); refreshFiles();
    }
    async function renamePath(p) {
      const v = (await ask({ title: "Rename", value: basename(p) }) || "").trim();
      if (!nameOk(v) || v === basename(p)) return;
      const to = join(dirname(p), v);
      if (!moveTo(p, to)) return toast("Can't rename", `"${v}" already exists`);
      tabs.forEach(t => { if (t.path === p || t.path.startsWith(p + "/")) { t.path = to + t.path.slice(p.length); t.ed.setLang(langOf(t.path)); } });
      refreshFiles(); syncTabs(); syncStatus();
    }
    async function deletePath(p) {
      const ok = await ask({ title: `Delete ${basename(p)}?`, msg: isDir(p) ? "The folder and everything in it will go." : "This can't be undone.", input: false, ok: "Delete" });
      if (!ok) return;
      tabs.filter(t => t.path === p || t.path.startsWith(p + "/")).forEach(t => closeTab(t, true));
      rm(p); refreshFiles();
    }

    /* ---- tabs ---- */
    function openFile(p, line) {
      if (!exists(p) || isDir(p)) return;
      if (FS[p].k === "img") return launch("viewer", p);
      let t = tabs.find(x => x.path === p);
      if (!t) {
        const host = el("div", "cx-host");
        area.appendChild(host);
        const text = readFile(p) || "";
        t = { path: p, host, saved: text, dirty: false };
        t.ed = makeEditor(host, {
          value: text, lang: langOf(p),
          onChange: () => { const d = t.ed.value !== t.saved; if (d !== t.dirty) { t.dirty = d; syncTabs(); } syncStatus(); livePreview(); },
          onCaret: pos => { if (t === active) S("pos").textContent = `Ln ${pos.line}, Col ${pos.col}` + (pos.sel ? ` (${pos.sel} selected)` : ""); },
          onKey: e => keys(e)
        });
        tabs.push(t);
        for (let d = dirname(p); d.length >= root.length && d !== "/"; d = dirname(d)) expanded.add(d);
      }
      activate(t);
      if (line) setTimeout(() => t.ed.gotoLine(line), 0);
    }
    function activate(t) {
      active = t;
      tabs.forEach(x => { x.host.hidden = x !== t; });
      empty.hidden = !!t;
      syncTabs(); syncStatus(); renderTree();
      setWinTitle(win, (t ? basename(t.path) + " · " : "") + "Code");
      if (t) { t.ed.refresh(); t.ed.focus(); if (!findBar.hidden) runFind(); }
      if (previewOn) refreshPreview();
    }
    function syncTabs() {
      tabsEl.innerHTML = "";
      tabs.forEach(t => {
        const b = el("div", "cx-tab" + (t === active ? " on" : "") + (t.dirty ? " dirty" : ""), `${ico(fileIcon(t.path))}<span>${esc(basename(t.path))}</span><button class="x" title="Close">${ico("x")}</button>`);
        b.title = t.path;
        b.onclick = e => { if (e.target.closest(".x")) closeTab(t); else activate(t); };
        b.onauxclick = e => { if (e.button === 1) closeTab(t); };
        tabsEl.appendChild(b);
      });
      const on = $(".cx-tab.on", tabsEl);
      if (on) keepVisible(tabsEl, on);
    }
    async function closeTab(t, force) {
      if (t.dirty && !force) {
        activate(t);
        const ok = await ask({ title: `Close ${basename(t.path)}?`, msg: "It has changes you haven't saved.", input: false, ok: "Discard changes" });
        if (!ok) return;
      }
      const i = tabs.indexOf(t);
      if (i < 0) return;
      tabs.splice(i, 1);
      t.host.remove();
      if (active === t) activate(tabs[i] || tabs[i - 1] || null);
      else syncTabs();
    }
    function syncStatus() {
      const t = active;
      S("lang").textContent = t ? LANG_NAME[langOf(t.path)] || (extOf(t.path) || "plain").toUpperCase() : "";
      S("state").textContent = t ? (t.dirty ? "● unsaved" : "saved") : "";
      S("path").textContent = t ? t.path.replace(HOME, "~") : root.replace(HOME, "~");
      if (!t) S("pos").textContent = "";
    }
    function saveTab(t = active) {
      if (!t) return;
      writeFile(t.path, t.ed.value);
      t.saved = t.ed.value; t.dirty = false;
      syncTabs(); syncStatus(); refreshFiles();
      S("state").textContent = "saved ✓";
    }

    /* ---- output panel ---- */
    const showPanel = on => { panel.hidden = !on; $('[data-a="panel"]', body).classList.toggle("on", on); };
    const FILE_REF = /\b([\w.-]+\.(?:m?js|html|css)):(\d+)(?::(\d+))?/g;
    function logText(text, cls = "", base = active ? dirname(active.path) : root) {
      const span = el("span", cls);
      span.innerHTML = esc(text).replace(FILE_REF, (m, f, l, col) => `<a data-file="${f}" data-line="${l}" data-col="${col || 1}" data-base="${esc(base)}">${m}</a>`);
      log.appendChild(span);
      while (log.childElementCount > 2000) log.firstElementChild.remove();
      log.scrollTop = log.scrollHeight;
    }
    const logLine = (text, cls, base) => logText(text + "\n", cls, base);
    log.addEventListener("click", e => {
      const a = e.target.closest("a[data-file]");
      if (!a) return;
      const p = join(a.dataset.base || root, a.dataset.file);
      if (exists(p)) { openFile(p); active.ed.gotoLine(+a.dataset.line, +a.dataset.col); }
    });
    const LVL = { log: "", info: "", debug: "mut", warn: "wr", error: "er" };

    /* ---- running ---- */
    // the page that loads this css/js file: the one already in the preview, then index.html, then any other
    const htmlOwner = p => {
      const dir = dirname(p), name = basename(p);
      const uses = k => new RegExp(`(src|href)=["']?(\\./)?${escRe(name)}["'\\s>]`).test(read(k) || "");
      const pages = [previewPath, join(dir, "index.html"), ...childrenOf(dir)];
      return pages.find(k => k && dirname(k) === dir && exists(k) && !isDir(k) && langOf(k) === "html" && uses(k)) || null;
    };
    function setRunning(on) {
      $('[data-a="run"]', body).hidden = on;
      $('[data-a="stop"]', body).hidden = !on;
    }
    function run() {
      const t = active;
      if (!t) return toast("Nothing to run", "Open a file first");
      const lang = langOf(t.path);
      if (lang === "html" || lang === "css" || lang === "md") return showPreview(true);
      if (lang === "js") {
        if (htmlOwner(t.path)) return showPreview(true);
        return runJS(t);
      }
      if (lang === "json") {
        showPanel(true);
        try { JSON.parse(t.ed.value); logLine(`✓ ${basename(t.path)} is valid JSON`, "ok"); }
        catch (e) { logLine(`✗ ${basename(t.path)}: ${e.message}`, "er"); }
        return;
      }
      if (lang === "sh") { if (t.dirty) saveTab(t); return runInTerminal(t.path); }
      showPanel(true);
      logLine(lang === "py"
        ? "Kestrel has no Python runtime. JavaScript runs here (Ctrl+Enter), HTML, CSS and Markdown preview live."
        : `Don't know how to run .${extOf(t.path) || "this"} files. JavaScript, HTML, CSS, Markdown, JSON and shell scripts work.`, "wr");
    }
    function runJS(t) {
      if (job) job.kill();
      showPanel(true);
      logLine(`▶ ${basename(t.path)}   ${new Date().toLocaleTimeString()}`, "hd");
      const t0 = performance.now();
      jobFile = t.path;
      const me = job = runScript({
        code: t.ed.value, filename: basename(t.path), cwd: dirname(t.path), env: { HOME, USER: cfg.user },
        onOut: (lvl, text) => { if (me !== job) return; if (lvl === "clear") log.innerHTML = ""; else logText(text, LVL[lvl], dirname(jobFile)); }
      });
      setRunning(true);
      me.done.then(code => {
        if (me !== job) return;
        const ms = Math.round(performance.now() - t0);
        logLine(code === 130 ? "■ stopped" : code ? `✗ exited with code ${code} after ${ms} ms` : `✓ finished in ${ms} ms`, code === 130 ? "mut" : code ? "er" : "ok");
        job = null; setRunning(false);
      });
    }
    function runInTerminal(p) {
      const lang = langOf(p);
      launch("terminal", { cwd: dirname(p), run: (lang === "js" ? "js " : "sh ") + basename(p).replace(/([\s'"\\$&|;<>()*?])/g, "\\$1") });
    }

    /* ---- preview ---- */
    function previewTarget() {
      const t = active;
      if (!t) return previewPath;
      const lang = langOf(t.path), dir = dirname(t.path);
      if (lang === "html" || lang === "md") return t.path;
      if (lang === "css" || lang === "js") return htmlOwner(t.path) || (exists(join(dir, "index.html")) ? join(dir, "index.html") : previewPath);
      return previewPath;
    }
    function refreshPreview(target = previewTarget()) {
      if (!target || !exists(target) && !tabs.some(t => t.path === target)) {
        previewPath = null;
        frame.srcdoc = `<body style="font:14px system-ui;color:#6c7072;display:grid;place-items:center;height:90vh;margin:0">Open an HTML or Markdown file to preview it.</body>`;
        $('[data-role="ptitle"]', body).textContent = "Preview";
        return;
      }
      previewPath = target;
      $('[data-role="ptitle"]', body).textContent = basename(target);
      frame.srcdoc = langOf(target) === "md" ? mdPage(read(target) || "", basename(target)) : buildPage(target, read) || "";
    }
    let liveTimer = 0;
    function livePreview() {
      if (!previewOn) return;
      clearTimeout(liveTimer);
      liveTimer = setTimeout(() => { const t = previewTarget(); if (t) refreshPreview(t); }, 450);
    }
    function showPreview(on) {
      previewOn = on;
      prev.hidden = !on;
      $('[data-a="preview"]', body).classList.toggle("on", on);
      if (on) refreshPreview();
      else frame.srcdoc = "";
    }
    frameHandlers.set(frame, m => {
      if (m.type === "console") {
        if (!panel.hidden || m.level === "error") showPanel(true);
        logLine(m.text, LVL[m.level] ?? "", dirname(previewPath || root));
      } else if (m.type === "nav") {
        if (/^https?:/i.test(m.href)) return launch("browser", m.href);
        const p = resolve(m.href.split(/[?#]/)[0], dirname(previewPath || root));
        if (exists(p) && !isDir(p)) refreshPreview(p);
        else logLine(`preview: ${m.href} doesn't exist`, "wr");
      } else if (m.type === "title" && m.text) {
        $('[data-role="ptitle"]', body).textContent = m.text + "  ·  " + basename(previewPath || "");
      }
    });

    /* ---- find ---- */
    function openFind() {
      findBar.hidden = false;
      const sel = active && active.ed.selection();
      if (sel && !sel.includes("\n")) fq.value = sel;
      fq.focus(); fq.select();
      runFind();
    }
    function closeFind() {
      findBar.hidden = true;
      tabs.forEach(t => t.ed.clearFind());
      if (active) active.ed.focus();
    }
    const showCount = r => { fcount.textContent = r.error ? "bad regex" : r.count ? `${r.idx + 1} of ${r.count}` : "no results"; };
    function runFind() {
      if (!active) return;
      const r = active.ed.search(fq.value, { ...findOpts, onChange: showCount });
      showCount(r);
      if (r.count) showCount(active.ed.step(0));
    }
    fq.addEventListener("input", runFind);
    fq.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); if (active) showCount(active.ed.step(e.shiftKey ? -1 : 1)); }
      if (e.key === "Escape") { e.preventDefault(); closeFind(); }
    });
    fr.addEventListener("keydown", e => {
      if (e.key === "Enter") { e.preventDefault(); $('[data-f="one"]', body).click(); }
      if (e.key === "Escape") { e.preventDefault(); closeFind(); }
    });
    $$("[data-f]", findBar).forEach(b => {
      if (b.tagName !== "BUTTON") return;
      b.onclick = () => {
        const f = b.dataset.f;
        if (f === "case" || f === "re") {
          const k = f === "case" ? "caseSensitive" : "regex";
          findOpts[k] = !findOpts[k]; b.classList.toggle("on", findOpts[k]); runFind();
        }
        if (!active) return;
        if (f === "next" || f === "prev") showCount(active.ed.step(f === "next" ? 1 : -1));
        if (f === "one") { active.ed.replace(fr.value, false); runFind(); }
        if (f === "all") { active.ed.replace(fr.value, true); runFind(); fq.focus(); }
        if (f === "close") closeFind();
      };
    });

    /* ---- quick open ---- */
    function quickOpen() {
      const old = $(".cx-quick", body);
      if (old) { old.remove(); return; }
      const box = el("div", "cx-quick", `<input class="tb-in" placeholder="Type to find a file" spellcheck="false"><div class="ql"></div>`);
      $(".cx-center", body).appendChild(box);
      const inp = $("input", box), list = $(".ql", box);
      const pool = Object.keys(FS).filter(k => FS[k].t === "f" && (k.startsWith(root + "/") || k.startsWith(HOME + "/")));
      let hits = [], hl = 0;
      const score = (p, q) => {
        const rel = p.startsWith(root + "/") ? p.slice(root.length + 1) : p.replace(HOME, "~");
        const s = rel.toLowerCase(), b = basename(p).toLowerCase();
        if (!q) return [0, rel];
        if (b.startsWith(q)) return [3, rel];
        if (b.includes(q)) return [2, rel];
        let i = 0;
        for (const ch of s) if (ch === q[i]) i++;
        return [i === q.length ? 1 : -1, rel];
      };
      const draw = () => {
        const q = inp.value.trim().toLowerCase();
        const inRoot = p => p.startsWith(root + "/") ? 1 : 0;
        hits = pool.map(p => [p, ...score(p, q)]).filter(x => x[1] >= 0).sort((a, b) => b[1] - a[1] || inRoot(b[0]) - inRoot(a[0]) || a[2].length - b[2].length).slice(0, 40);
        hl = Math.min(hl, Math.max(0, hits.length - 1));
        list.innerHTML = "";
        hits.forEach(([p, , rel], i) => {
          const b = el("button", i === hl ? "hl" : "", `${ico(fileIcon(p))}<span>${esc(basename(p))}</span><small>${esc(dirname(rel) === "." ? "" : rel)}</small>`);
          b.onclick = () => { box.remove(); openFile(p); };
          list.appendChild(b);
        });
        if (!hits.length) list.appendChild(el("div", "hint", "&nbsp; No matching files"));
      };
      inp.addEventListener("input", () => { hl = 0; draw(); });
      inp.addEventListener("keydown", e => {
        if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); hl = (hl + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % Math.max(1, hits.length); draw(); const h = $(".hl", list); if (h) keepVisible(list, h); }
        if (e.key === "Enter" && hits[hl]) { e.preventDefault(); box.remove(); openFile(hits[hl][0]); }
        if (e.key === "Escape") { e.preventDefault(); box.remove(); if (active) active.ed.focus(); }
      });
      inp.addEventListener("blur", () => setTimeout(() => { if (!box.contains(document.activeElement)) box.remove(); }, 150));
      draw(); inp.focus();
    }
    async function gotoLine() {
      if (!active) return;
      const v = await ask({ title: "Go to line", value: "" });
      if (v && /^\d+(:\d+)?$/.test(v.trim())) { const [l, c] = v.trim().split(":").map(Number); active.ed.gotoLine(l, c || 1); }
    }

    /* ---- keys and buttons ---- */
    function keys(e) {
      const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
      if (!mod) return false;
      if (k === "s") { e.preventDefault(); saveTab(); return true; }
      if (k === "enter") { e.preventDefault(); run(); return true; }
      if (k === "f" || k === "h") { e.preventDefault(); openFind(); return true; }
      if (k === "p") { e.preventDefault(); quickOpen(); return true; }
      if (k === "g") { e.preventDefault(); gotoLine(); return true; }
      if (k === "b") { e.preventDefault(); app.classList.toggle("noside"); return true; }
      if (k === "j" || k === "`") { e.preventDefault(); showPanel(panel.hidden); return true; }
      return false;
    }
    body.addEventListener("keydown", e => { if (e.target.closest(".cx-ta, .cx-find, .cx-quick")) return; keys(e); });
    $$("[data-a]", body).forEach(b => b.onclick = () => {
      const a = b.dataset.a;
      if (a === "side") app.classList.toggle("noside");
      if (a === "new" || a === "nf") newFile(a === "nf" ? root : undefined);
      if (a === "nd") newFolder(root);
      if (a === "up") setRoot(dirname(root));
      if (a === "save") saveTab();
      if (a === "run") run();
      if (a === "stop" && job) job.kill();
      if (a === "preview") showPreview(!previewOn);
      if (a === "panel") showPanel(panel.hidden);
      if (a === "find") findBar.hidden ? openFind() : closeFind();
      if (a === "quick") quickOpen();
      if (a === "sample") { const p = HOME + "/Projects/hello-web/index.html"; if (exists(p)) { setRoot(HOME + "/Projects"); openFile(p); showPreview(true); } else toast("Sample missing", "It was deleted from Projects"); }
    });
    $$("[data-p]", body).forEach(b => b.onclick = () => { if (b.dataset.p === "clear") log.innerHTML = ""; else showPanel(false); });
    $$("[data-v]", body).forEach(b => b.onclick = () => {
      const v = b.dataset.v;
      if (v === "reload") refreshPreview(previewPath || undefined);
      if (v === "browser" && previewPath) launch("browser", "file://" + previewPath);
      if (v === "close") showPreview(false);
    });

    // stay in step with changes made elsewhere (terminal, Files, other apps)
    const onDisk = () => {
      renderTree();
      tabs.forEach(t => {
        const c = readFile(t.path);
        if (c != null && !t.dirty && c !== t.saved) { t.saved = c; t.ed.setValue(c); }
      });
    };
    fileViews.add(onDisk);

    win.beforeClose = async () => {
      const dirty = tabs.filter(t => t.dirty);
      return !dirty.length || !!(await ask({ title: "Discard unsaved changes?", msg: dirty.map(t => basename(t.path)).join(", ") + (dirty.length === 1 ? " has" : " have") + " unsaved edits.", input: false, ok: "Discard" }));
    };
    win.api = {
      open(p) {
        if (!p || !exists(p)) return;
        if (isDir(p)) { setRoot(p); return; }
        if (!(p === root || p.startsWith(root + "/"))) setRoot(dirname(p));
        openFile(p);
      }
    };
    setRoot(root);
    if (arg) win.api.open(arg);
    else syncStatus();
    return () => { fileViews.delete(onDisk); frameHandlers.delete(frame); if (job) job.kill(); clearTimeout(liveTimer); };
  }
};

/* ============================================================
   8 · Calculator
   ============================================================ */
APPS.calc = {
  name: "Calculator", icon: "calc", desc: "Arithmetic, keyboard friendly", w: 268, h: 372,
  mount(body) {
    const keys = [["C", "±", "%", "÷"], ["7", "8", "9", "×"], ["4", "5", "6", "−"], ["1", "2", "3", "+"], ["0", ".", "⌫", "="]];
    body.innerHTML = `<div class="calc">
      <div class="readout"><div class="sm"></div><div class="big">0</div></div>
      <div class="keys">${keys.flat().map(k =>
        `<button class="ctl ${"÷×−+".includes(k) ? "op" : ""} ${k === "=" ? "eq" : ""}" data-k="${k}">${k}</button>`).join("")}</div>
    </div>`;
    const big = $(".big", body), sm = $(".sm", body);
    let acc = null, op = null, cur = "0", fresh = true;
    const show = () => { big.textContent = cur.length > 12 ? Number(cur).toPrecision(9) : cur; sm.textContent = acc !== null ? `${acc} ${op || ""}` : ""; };
    const calcOp = (a, b, o) => o === "+" ? a + b : o === "−" ? a - b : o === "×" ? a * b : o === "÷" ? (b === 0 ? NaN : a / b) : b;
    function press(k) {
      if (/[0-9]/.test(k)) { cur = fresh ? k : (cur === "0" ? k : cur + k); fresh = false; }
      else if (k === ".") { if (fresh) { cur = "0."; fresh = false; } else if (!cur.includes(".")) cur += "."; }
      else if (k === "C") { acc = null; op = null; cur = "0"; fresh = true; }
      else if (k === "⌫") { cur = cur.length > 1 ? cur.slice(0, -1) : "0"; }
      else if (k === "±") { cur = cur.startsWith("-") ? cur.slice(1) : "-" + cur; }
      else if (k === "%") { cur = String(parseFloat(cur) / 100); }
      else if ("+−×÷".includes(k)) {
        if (acc !== null && op && !fresh) acc = calcOp(acc, parseFloat(cur), op);
        else acc = parseFloat(cur);
        op = k; fresh = true; cur = String(acc);
      } else if (k === "=") {
        if (op !== null && acc !== null) {
          const r = calcOp(acc, parseFloat(cur), op);
          cur = Number.isFinite(r) ? String(Math.round(r * 1e10) / 1e10) : "undefined";
          acc = null; op = null; fresh = true;
        }
      }
      show();
    }
    $$("[data-k]", body).forEach(b => b.onclick = () => press(b.dataset.k));
    const map = { "/": "÷", "*": "×", "-": "−", "+": "+", "Enter": "=", "=": "=", "Backspace": "⌫", "Escape": "C", "c": "C", "%": "%" };
    body.tabIndex = 0;
    body.addEventListener("keydown", e => {
      const k = map[e.key] || (/^[0-9.]$/.test(e.key) ? e.key : null);
      if (k) { e.preventDefault(); press(k); const btn = $(`[data-k="${k}"]`, body); if (btn) { btn.classList.add("on"); setTimeout(() => btn.classList.remove("on"), 90); } }
    });
    setTimeout(() => body.focus(), 40);
    show();
  }
};

   9 · Paint
   ============================================================ */
APPS.paint = {
  name: "Paint", icon: "paint", desc: "Draw and save a picture", w: 520, h: 452,
  mount(body, win) {
    const PAL = ["#1b1d1e", "#cf5a4c", "#f0a92c", "#4f9d69", "#2f7fa8", "#8a5ba8", "#c9825f", "#ffffff"];
    body.innerHTML = `
      <div class="stack">
        <div class="toolbar">
          <div class="swatches">${PAL.map((c, i) => `<button class="sw ${i === 0 ? "on" : ""}" data-c="${c}" style="background:${c}" title="${c}"></button>`).join("")}</div>
          <div class="div"></div>
          <button class="ctl" data-s="2">Fine</button>
          <button class="ctl on" data-s="6">Medium</button>
          <button class="ctl" data-s="18">Broad</button>
          <div class="div"></div>
          <button class="ctl" data-a="erase">Eraser</button>
          <button class="ctl" data-a="clear">Clear</button>
          <div class="sp"></div>

const SEARCH_URL = "https://www.google.com/search?igu=1&q=";
// these send X-Frame-Options / frame-ancestors, so a frame would only ever show an error
const NO_FRAME = /(^|\.)(github\.com|stackoverflow\.com|reddit\.com|x\.com|twitter\.com|facebook\.com|instagram\.com|linkedin\.com|duckduckgo\.com|news\.ycombinator\.com|developer\.mozilla\.org|claude\.ai|chatgpt\.com|openai\.com|apple\.com|nytimes\.com|netflix\.com|mail\.google\.com|docs\.google\.com|drive\.google\.com)$/i;
// known to be happy inside a frame, so no warning strip
const FRAMES_OK = /(^|\.)(wikipedia\.org|google\.com|archive\.org|openlibrary\.org|npr\.org|wiby\.me|example\.com|youtube\.com|bing\.com)$/i;
const DEFAULT_BOOKMARKS = [
